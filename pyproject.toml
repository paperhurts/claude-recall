[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "claude-recall"
version = "0.1.0"
description = "Back up your Claude conversations when export isn't available"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [
    {name = "Sidney Thomas"},
]
keywords = ["claude", "anthropic", "backup", "conversations", "llm"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Utilities",
]
dependencies = [
    "playwright>=1.40",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[project.urls]
Homepage = "https://github.com/paperhurts/claude-recall"
Issues = "https://github.com/paperhurts/claude-recall/issues"

[project.scripts]
claude-recall = "claude_recall.extractor:main"
claude-recall-backfill = "claude_recall.backfill_thinking:main"
claude-recall-search = "claude_recall.search:main"

[tool.setuptools.packages.find]
include = ["claude_recall*"]

[tool.setuptools.package-data]
claude_recall = ["schema.sql"]
